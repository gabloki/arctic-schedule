<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light">
<title>Arctic garments build schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#F2F4F3;--surface:#FFFFFF;--surface-2:#E9EDEB;--ink:#15202A;--ink-2:#4F5B64;--ink-3:#7F8A92;--line:rgba(21,32,42,.12);--line-2:rgba(21,32,42,.24);--accent:#1F6E8C;--ok:#2E7D4F;--warn:#9A5B12;--danger:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171C;--surface:#1A2128;--surface-2:#232C34;--ink:#E6ECEF;--ink-2:#A9B4BB;--ink-3:#74808A;--line:rgba(230,236,239,.12);--line-2:rgba(230,236,239,.26);--accent:#62B3D2;--ok:#6CC08E;--warn:#E0A55A;--danger:#F2847B}}
:root[data-theme="dark"]{--bg:#11171C;--surface:#1A2128;--surface-2:#232C34;--ink:#E6ECEF;--ink-2:#A9B4BB;--ink-3:#74808A;--line:rgba(230,236,239,.12);--line-2:rgba(230,236,239,.26);--accent:#62B3D2;--ok:#6CC08E;--warn:#E0A55A;--danger:#F2847B}
html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--surface-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--surface-2)}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
.hero p{margin:4px 0 0;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .lab{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
.stat .num{font-size:20px;font-weight:600;margin-top:2px}
.stat .sub{font-size:12px;color:var(--ink-3)}
.ok{color:var(--ok)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar .title{font-size:18px;font-weight:600;flex:1;min-width:180px;margin-left:4px}
.seg{display:inline-flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.seg button.on{background:var(--surface-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.scroller{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lanes{min-width:760px}
.lrow{display:grid;grid-template-columns:128px repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lhead{border-bottom:1px solid var(--line-2)}
.lhead div{text-align:center;padding:8px 0}
.dname{font-size:11px;color:var(--ink-3)}
.dnum{font-size:16px;font-weight:600;display:inline-block;min-width:30px;line-height:30px;border-radius:15px}
.dnum.today{background:var(--accent);color:#fff}
.who{display:flex;align-items:flex-start;gap:8px;padding:10px;font-weight:600;font-size:13px;border-right:1px solid var(--line);background:var(--surface)}
.who .dot{margin-top:5px}
.cell{border-left:1px solid var(--line);min-height:44px;padding:2px}
.chip{display:block;width:calc(100% - 4px);text-align:left;margin:2px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.35;cursor:pointer;color:var(--ink)}
.chip:hover{filter:brightness(.97)}
.chip svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.chip .dates{display:block;font-size:11px;color:var(--ink-3)}
.chip.c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;font-size:11px}
.chip.c .dates{display:none}
.made h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.made .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wkb{margin-bottom:12px}
.wkh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--surface-2);cursor:pointer;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;font-size:13px}
.wkh:hover{filter:brightness(.98)}
.mini{display:inline-flex;align-items:center;gap:3px;margin-right:10px;color:var(--ink-2)}
.mini svg{width:15px;height:15px}
.ico{width:16px;height:16px;flex:none}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.status{font-size:12px;color:var(--ink-2)}
.status.dirty{color:var(--warn)}
.status.err{color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:10}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:100%;max-width:660px;padding:20px}
.dialog h2{font-size:18px;font-weight:600;margin:0 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.checks label{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.checks input{width:auto}
.outrow{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:6px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions div{display:flex;gap:8px}
.danger{color:var(--danger)}
.err-msg{color:var(--danger);font-size:12px;margin-top:4px;min-height:16px}
.prow{display:grid;grid-template-columns:1fr 64px;gap:6px;margin-bottom:6px}
.prodrow{display:grid;grid-template-columns:1fr 70px 70px 1.1fr;gap:6px;margin-bottom:6px}
.colhead{display:grid;font-size:11px;color:var(--ink-3);gap:6px;margin-bottom:4px}
input[type=color]{padding:2px;height:34px}
.stripsec h2{font-size:16px;font-weight:600;margin:0}
.stripsec p{margin:2px 0 10px;font-size:13px;color:var(--ink-2)}
.stripsec p:empty{display:none}
.hset{align-self:flex-start}
.hset>summary{display:inline-block}
.hset-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 12px}
.hset-btn:hover{background:var(--surface-2)}
.hset-btn svg{width:14px;height:14px;transition:transform .15s}
.hset[open] .hset-btn svg{transform:rotate(180deg)}
.hset>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hset-body{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dlink{display:inline-flex;align-items:flex-start;gap:4px;margin-top:6px;font-size:12px;color:var(--accent);text-decoration:none;line-height:1.35}
.dlink:hover{text-decoration:underline}
.dlink svg{width:14px;height:14px;flex:none;margin-top:1px}
.chipsec{margin:-6px 0 22px}
.chipsec.bottom{margin:28px 0 0}
.chipsec.bottom h2{font-size:18px;margin-bottom:10px}
.tlsec{margin-top:32px}
.tlhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tlhead h2{font-size:18px;font-weight:600;margin:0}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tl>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tln{position:absolute;transform:translateX(-50%);text-align:center;background:none;border:none;padding:0;cursor:pointer;color:var(--ink)}
.tln:hover{background:none}
.tln .nd{width:30px;height:30px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2.5px solid;border-radius:50%}
.tln.garment .nd{border-radius:7px;transform:rotate(45deg)}
.tln.garment .nd svg{transform:rotate(-45deg)}
.tln .nd svg{width:15px;height:15px}
.tln.prop .nd{border-style:dashed}
.tln.done .nd{color:#fff}
.tln .cd{margin-top:8px;font-size:12px;line-height:1.35}
.tln .dt{font-weight:600}
.tln .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tln .wh{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:11px;margin-top:2px}
.tln:hover .tt{text-decoration:underline}
.tlend{position:absolute;font-size:11px;font-weight:600;color:var(--ink-3);transform:translate(-50%,-50%);background:var(--surface);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.tlstart{transform:translate(0,-50%)}
.chipsec h2,.made h3{font-size:14px;font-weight:600;margin:0 0 8px}
.chipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.chipcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.chipcard summary{display:block}
.chipcard .cn{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;color:var(--ink-2)}
.chipcard .num{font-size:20px;font-weight:600}
.chipcard .sub{font-size:12px;color:var(--ink-3)}
.more{font-size:11px;color:var(--accent);display:inline-flex;align-items:center;gap:2px;margin-top:2px}
.more svg{width:12px;height:12px;transition:transform .15s}
details[open] .more svg{transform:rotate(90deg)}
.brk{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.brk div{display:flex;justify-content:space-between;gap:8px}
.tchips{margin-top:6px;font-size:12px}
.tchips summary{color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.tchips .list{margin-top:4px;color:var(--ink-2);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px}
.inv{margin-top:28px}
.inv h2{font-size:18px;font-weight:600;margin:0 0 10px}
.inv table{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}
.inv th{text-align:left;font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:10px 12px;vertical-align:bottom;border-bottom:1px solid var(--line-2)}
.inv td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.inv tr:last-child td{border-bottom:none}
.inv td.n{font-variant-numeric:tabular-nums}
.inv .comp{display:flex;align-items:center;gap:8px}
.inv .q{font-weight:600}
.inv .tag{display:block;font-size:11px;font-weight:400;margin-top:1px}
.inv .short{color:var(--warn)}
.inv .met{color:var(--ok)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner[hidden]{display:none}
.chip .done{color:var(--ok)}
.ctx{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.ctx[hidden]{display:none}
.ctx button{display:flex;justify-content:space-between;gap:16px;width:100%;border:none;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;font-size:13px}
.ctx button:hover,.ctx button:focus-visible{background:var(--surface-2)}
.ctx button kbd{font-family:inherit;font-size:11px;color:var(--ink-3)}
.ctx .muted{padding:7px 10px;font-size:12px;color:var(--ink-3)}
.ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.chip.copied{outline:2px dashed var(--accent);outline-offset:1px}
.lanes{position:relative}
.chip{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.chip.dragging{opacity:.35}
.h-l,.h-r{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
.h-l{left:0}.h-r{right:0}
.h-l::after,.h-r::after{content:"";position:absolute;top:25%;bottom:25%;left:3px;width:3px;border-radius:2px;background:currentColor;opacity:0}
.chip:hover .h-l::after,.chip:hover .h-r::after{opacity:.4}
.preview{position:absolute;border:2px solid var(--accent);border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);pointer-events:none;z-index:5;padding:2px 6px;font-size:11px;font-weight:600;color:var(--accent);overflow:hidden;white-space:nowrap}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
body.is-resizing,body.is-resizing *{cursor:ew-resize!important;user-select:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.agenda{display:flex;flex-direction:column}
.aday{border-bottom:1px solid var(--line);padding:8px 10px}
.aday:last-child{border-bottom:none}
.aday.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.ahead .dl{font-size:13px;font-weight:600}
.ahead .dl span{color:var(--ink-3);font-weight:400;margin-right:4px}
.ahead .dl.today span,.ahead .dl.today{color:var(--accent)}
.ahead button{padding:4px 10px;font-size:12px}
.achip{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.achip .ap{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2)}
.aempty{font-size:12px;color:var(--ink-3);padding:2px 0 4px}
@media (max-width:640px){.hero h1{font-size:22px}.row2{grid-template-columns:1fr}
.wrap{padding:16px 12px 40px}
.hero{align-items:stretch}
.hero>div:last-child{width:100%}
.hero>div:last-child button{flex:1 1 auto}
.bar .title{order:-1;width:100%;flex-basis:100%;margin:0 0 4px;font-size:17px}
input,select,textarea{font-size:16px}
button{min-height:40px}
.chip{min-height:0}
.dialog{padding:16px}
.overlay{padding:max(12px,env(safe-area-inset-top,0px)) 10px max(12px,env(safe-area-inset-bottom,0px))}
.outrow{grid-template-columns:1fr 72px 40px}
.prodrow,.colhead{grid-template-columns:1fr 60px 60px!important}
.prodrow input:nth-child(4),.colhead span:nth-child(4){grid-column:1 / -1}
.legend{gap:8px 12px}
.made .grid,.strip{grid-template-columns:repeat(2,minmax(0,1fr))}
.inv h2,.tlhead h2,.chipsec.bottom h2{font-size:17px}
.inv table{min-width:640px;font-size:13px}
.inv th,.inv td{padding:8px}
.inv th:first-child,.inv td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.inv th:first-child{background:var(--surface-2)}
.ctx{min-width:200px}
.ctx button{padding:10px 12px;font-size:15px}}
@media (pointer:coarse){.chip{touch-action:manipulation;cursor:pointer;-webkit-touch-callout:none}.h-l,.h-r{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function chipsOf(p,qty){if(!p.chips||!p.chips.length)return '';return '<details class="tchips"><summary>'+svg('chip','ico')+p.chips.length+' temp chips per fiber</summary><div class="list">'+p.chips.map(esc).join(', ')+'</div><div class="list" style="font-family:inherit">'+qty*p.chips.length+' chips for '+qty+' fibers</div></details>'}
function statTile(p,big,sub,ok,extra){return '<div class="stat"><div class="lab">'+svg(p.icon)+esc(p.name)+'</div><div class="num">'+big+'</div><div class="sub'+(ok?' ok':'')+'">'+(ok?svg('check','ico')+' ':'')+sub+'</div>'+(extra||'')+'</div>'}
function chipCard(name,big,sub,lines){return '<details class="chipcard"><summary><div class="cn">'+svg('temp','ico')+esc(name)+'</div><div class="num">'+big+'</div><div class="sub">'+sub+'</div><span class="more">'+svg('right')+'Breakdown</span></summary><div class="brk">'+lines+'</div></details>'}

var tlFilter='all';

function garment(id){var g=D.garments||[];for(var i=0;i<g.length;i++)if(g[i].id===id)return g[i];return null}
function msLabel(t){if(msType(t)==='garment'&&t.gout&&t.gout.length)return t.gout.map(function(o){var g=garment(o.g);return (g?g.name.replace(/ \(pairs\)/,''):o.g)+' ×'+o.n+(g&&/pairs/.test(g.name)?' pairs':'')}).join(', ')+' integrated';if(msType(t)==='fiber'&&t.out&&t.out.length)return t.out.map(function(o){var p=product(o.p);return (p?p.name:o.p)+' ×'+o.n}).join(', ')+' drawn';return t.short||t.text}

if(!ms.length){box.style.height='';box.innerHTML='<p class="note" style="padding:16px;margin:0">No milestones yet. Set “Milestone timeline” in a task to add one.</p>';return}
var W=box.clientWidth||960,cols=W<520?2:W<760?3:W<1000?4:5,rowH=180,R=rowH/2,top=44;
var rows=Math.ceil(ms.length/cols),H=top+(rows-1)*rowH+130;
var RX=Math.min(R,Math.max(26,W*0.07)),inner=W-2*RX,xs=function(i){return RX+inner*(i+0.5)/cols};
var pts=ms.map(function(t,i){var r=Math.floor(i/cols),c=i%cols;if(r%2)c=cols-1-c;return {x:xs(c),y:top+r*rowH,t:t}});
var path='M '+Math.max(8,RX-30)+' '+top;
for(var r=0;r<rows;r++){var y=top+r*rowH,ltr=r%2===0,last=r===rows-1;
var nInRow=Math.min(cols,ms.length-r*cols),endX=last?(ltr?xs(nInRow-1):xs(cols-nInRow)):(ltr?W-RX:RX);
path+=' L '+endX+' '+y;
if(!last)path+=' A '+RX+' '+R+' 0 0 '+(ltr?1:0)+' '+endX+' '+(y+rowH)}
var h='<svg width="'+W+'" height="'+H+'" aria-hidden="true"><path d="'+path+'" fill="none" stroke="var(--line-2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var first=ms[0],lastP=pts[pts.length-1];
h+='<span class="tlend tlstart" style="left:8px;top:'+top+'px">Start</span>';
var cw=Math.min(170,inner/cols-8);
pts.forEach(function(p){var t=p.t,k=msType(t),c=person(t.who).color,ic=k==='garment'?(t.product&&product(t.product)?product(t.product).icon:'gar'):(t.out&&t.out[0]&&product(t.out[0].p)?product(t.out[0].p).icon:'flag');
if(t.milestone)ic='flag';
if(k==='garment'&&t.gout&&t.gout[0]&&garment(t.gout[0].g))ic=garment(t.gout[0].g).icon;
var e=pd(t.end),s0=pd(t.start),dt=same(s0,e)?fmt(e):'by '+fmt(e);
h+='<button type="button" class="tln '+k+(t.proposed?' prop':'')+(t.done?' done':'')+'" data-id="'+esc(t.id)+'" style="left:'+p.x+'px;top:'+(p.y-15)+'px;width:'+cw+'px" title="'+esc(person(t.who).name+': '+msLabel(t)+' ('+dt+')')+'">'+
'<span class="nd" style="border-color:'+c+';color:'+(t.done?'#fff':c)+';'+(t.done?'background:'+c:'')+'">'+svg(t.done?'check':ic)+'</span>'+
'<span class="cd"><span class="dt">'+dt+'</span><span class="tt">'+esc(msLabel(t))+'</span><span class="wh"><span class="dot" style="background:'+c+'"></span>'+esc(person(t.who).name)+'</span></span></button>'});
var del=null;D.tasks.forEach(function(t){if(t.milestone&&/deliver/i.test(t.short)&&(!del||t.end>del.end))del=t});
if(del){var lr=Math.floor((pts.length-1)/cols)%2===0,ex=lr?Math.min(W-50,lastP.x+cw/2+40):Math.max(50,lastP.x-cw/2-40);h=h.replace('</svg>','<path d="M '+lastP.x+' '+lastP.y+' L '+ex+' '+lastP.y+'" stroke="var(--line-2)" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/></svg>');h+='<span class="tlend" style="left:'+ex+'px;top:'+lastP.y+'px">'+esc(del.short)+' '+fmt(pd(del.end))+'</span>'}
box.style.height=H+'px';box.innerHTML=h}

function setStatus(msg,cls){var s=$('status');if(msg){s.textContent=msg;s.className='status'+(cls?' '+cls:'');return}

var saving=false,artifactReady=null,localOnly=!inViewer;
$('b-save').onclick=function(){
if(artifactReady&&!artifactNS&&!readOnly){setStatus('Connecting…');artifactReady.then(function(){$('b-save').onclick()});return}
if(saving)return;
if(!dirty){setStatus('No changes to save');setTimeout(function(){setStatus()},1800);return}
if(artifactNS&&!readOnly){
saving=true;setStatus('Saving…');
artifactNS.publish(buildHTML()).then(function(){dirty=false;saving=false;try{localStorage.removeItem(LSKEY)}catch(e){}setStatus('Saved')}).catch(function(err){saving=false;var c=err&&err.code;
if(c==='conflict'){setStatus('A newer version was saved elsewhere. Reloading it.')}
else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){readOnly=true;saveLocal();setStatus('You can view this page but not save it here. Changes kept in this browser only.')}
else if(c==='rate_limited'){setStatus('Saving too often. Wait a moment, then save again.','err')}
else if(c==='too_large'){setStatus('The schedule is too large to save. Remove some tasks and try again.','err')}
else{setStatus('Couldn’t save. Try again.','err')}})}
else{saveLocal();setStatus('Saved in this browser only. Open this page inside Claude to save it for everyone.','dirty')}};
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify({v:2,base:EMBED_H,data:D}));dirty=false}catch(e){setStatus('Couldn’t save in this browser.','err')}}

$('b-dl').onclick=function(){var html=buildHTML(),name='arctic-schedule.html';
if(downloadsNS){downloadsNS.save({filename:name,data:html}).catch(function(err){if(err&&err.code!=='cancelled'&&err.code!=='declined')setStatus('Couldn’t download the file.','err')});return}
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)};

var EMBED_H=(function(t){var h=5381;for(var i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36)})(document.getElementById('data').textContent);
function readLocal(){try{var s=localStorage.getItem(LSKEY);if(!s)return null;var x=JSON.parse(s);if(x&&x.v===2&&x.data&&x.data.tasks)return {data:x.data,base:x.base};if(x&&x.tasks&&x.people&&x.products)return {data:x,base:null}}catch(e){}return null}
function sig(o){return JSON.stringify([o.title,o.subtitle,o.people,o.tasks,o.products.map(function(p){return [p.id,p.name,p.need,p.start,p.chips||null]})])}
function fillChips(x){if(!x.garments)x.garments=JSON.parse(JSON.stringify(D.garments||[]));var def={};D.products.forEach(function(p){def[p.id]=p.chips});x.products.forEach(function(p){if(!p.chips)p.chips=def[p.id]||[]});return x}

$('bn-use').onclick=function(){D=fillChips(x);$('banner').hidden=true;init();dirty=true;render();$('b-save').onclick()};
$('bn-discard').onclick=function(){try{localStorage.removeItem(LSKEY)}catch(e){}$('banner').hidden=true;setStatus()}}
function loadLocal(){var r=readLocal();if(!r||sig(fillChips(r.data))===sig(D))return;
if(r.base===EMBED_H){D=fillChips(r.data);init();render();return}
showBanner(r.data,'This browser has different changes saved from another copy of this page. The page is showing this file’s version. Use the browser’s changes instead?')}

var REF=new Date(2020,0,6);
function bizIndex(d){var days=Math.round((d-REF)/864e5),w=Math.floor(days/7),r=days-w*7;return w*5+Math.min(r,4)}
function fromBiz(i){var w=Math.floor(i/5),r=i-w*5;return add(REF,w*7+r)}
function addBiz(d,n){return fromBiz(bizIndex(d)+n)}
var drag=null,suppress=false;
function heads(L){return L.querySelectorAll('.lhead .dh')}
function dateAt(L,x){var mon=pd(L.getAttribute('data-week')),hs=heads(L);for(var i=0;i<hs.length;i++){if(x<hs[i].getBoundingClientRect().right)return add(mon,i)}return add(mon,4)}
function rowAt(L,y){var rs=L.querySelectorAll('.lrow[data-person]');for(var i=0;i<rs.length;i++){var r=rs[i].getBoundingClientRect();if(y>=r.top&&y<r.bottom)return rs[i]}return null}
function clearPreview(){var p=document.querySelector('.preview');if(p)p.remove()}
function showPreview(L,ns,ne,who){
clearPreview();
var mon=pd(L.getAttribute('data-week')),b0=bizIndex(mon),s=bizIndex(ns)-b0,e=bizIndex(ne)-b0;
if(e<0||s>4)return;s=Math.max(0,s);e=Math.min(4,e);
var row=L.querySelector('.lrow[data-person="'+who+'"]');if(!row)return;
var hs=heads(L),lr=L.getBoundingClientRect(),rr=row.getBoundingClientRect(),a=hs[s].getBoundingClientRect(),z=hs[e].getBoundingClientRect();
var p=document.createElement('div');p.className='preview';
p.style.left=(a.left-lr.left+2)+'px';p.style.width=(z.right-a.left-4)+'px';p.style.top=(rr.top-lr.top+2)+'px';p.style.height=(rr.height-4)+'px';
p.textContent=(drag.copy?'Copy: ':'')+(same(ns,ne)?fmt(ns):fmt(ns)+' – '+fmt(ne))+(who!==drag.t.who?', '+person(who).name:'');
L.appendChild(p)}
$('view').addEventListener('pointerdown',function(ev){
if(readOnly||ev.button!==0||ev.pointerType==='touch')return;
var c=ev.target.closest('.chip');if(!c)return;
var t=task(c.getAttribute('data-id')),L=c.closest('.lanes');if(!t||!L)return;
var h=ev.target.closest('[data-h]');
drag={t:t,el:c,kind:h?h.getAttribute('data-h'):'move',x0:ev.clientX,y0:ev.clientY,grab:dateAt(L,ev.clientX),started:false,L:L,ns:pd(t.start),ne:pd(t.end),who:t.who};
document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onCancel);
});
function onMove(ev){
if(!drag)return;
if(!drag.started){if(Math.abs(ev.clientX-drag.x0)+Math.abs(ev.clientY-drag.y0)<5)return;drag.started=true;drag.el.classList.add('dragging');document.body.classList.add(drag.kind==='move'?'is-dragging':'is-resizing')}
ev.preventDefault();
var under=document.elementFromPoint(ev.clientX,ev.clientY),L=(under&&under.closest('.lanes'))||drag.L;
if(drag.kind!=='move')L=drag.L;
var d=dateAt(L,ev.clientX),t=drag.t,s0=pd(t.start),e0=pd(t.end);
if(drag.kind==='move'){var k=bizIndex(d)-bizIndex(drag.grab);drag.ns=addBiz(s0,k);drag.ne=addBiz(e0,k);var r=rowAt(L,ev.clientY);drag.who=r?r.getAttribute('data-person'):drag.who}
else if(drag.kind==='l'){drag.ns=d<=e0?d:e0;drag.ne=e0}
else{drag.ne=d>=s0?d:s0;drag.ns=s0}
drag.copy=drag.kind==='move'&&ev.altKey;drag.L=L;showPreview(L,drag.ns,drag.ne,drag.who)}
function endDrag(){document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onCancel);document.body.classList.remove('is-dragging','is-resizing');clearPreview();if(drag&&drag.el)drag.el.classList.remove('dragging')}
function onUp(ev){
if(!drag)return;var d=drag;endDrag();drag=null;
if(!d.started)return;
suppress=true;setTimeout(function(){suppress=false},0);
var t=d.t,ns=iso(d.ns),ne=iso(d.ne);
if(d.kind==='move'&&ev&&ev.altKey){snap();var c=cloneTask(t);c.start=ns;c.end=ne;c.who=d.who;D.tasks.push(c);markDirty();setStatus('Copied to '+fmt(d.ns)+', '+person(d.who).name+'. Unsaved changes','dirty');return}
if(ns===t.start&&ne===t.end&&d.who===t.who)return;
snap();
var moved=d.who!==t.who;
t.start=ns;t.end=ne;t.who=d.who;
markDirty();
setStatus((moved?'Moved to '+person(d.who).name+'. ':'')+'Unsaved changes','dirty')}
function onCancel(){endDrag();drag=null}
var clip=null,hover={x:null,y:null,chip:null};
function newId(){var n=1;while(task('t'+n))n++;return 't'+n}
function cloneTask(t){var c=JSON.parse(JSON.stringify(t));c.id=newId();delete c.done;return c}
function copyTask(id){var t=task(id);if(!t)return;clip=JSON.parse(JSON.stringify(t));[].forEach.call(document.querySelectorAll('.chip.copied'),function(e){e.classList.remove('copied')});var el=document.querySelector('.chip[data-id="'+id+'"]');if(el)el.classList.add('copied');if(NARROW.matches){render();setStatus('Copied “'+t.short+'”. Tap “Paste here” on any day.')}else setStatus('Copied “'+t.short+'”. Point at a day and press '+(isMac?'⌘':'Ctrl')+'+V, or right-click a day.')}
function pasteAt(date,who){if(!clip){setStatus('Copy a task first');return}if(readOnly)return;
var dur=bizIndex(pd(clip.end))-bizIndex(pd(clip.start));
snap();var c=cloneTask(clip);c.start=iso(date);c.end=iso(addBiz(date,Math.max(0,dur)));c.who=who||clip.who;D.tasks.push(c);markDirty();
setStatus('Pasted “'+c.short+'” on '+fmt(date)+', '+person(c.who).name+'. Unsaved changes','dirty')}
function duplicateTask(id){var t=task(id);if(!t||readOnly)return;snap();var c=cloneTask(t);D.tasks.push(c);markDirty();setStatus('Duplicated “'+t.short+'” on the same dates. Drag it where you need it.','dirty')}
function deleteTask(id){var t=task(id);if(!t||readOnly)return;snap();D.tasks=D.tasks.filter(function(x){return x.id!==id});markDirty();setStatus('Deleted “'+t.short+'”. Press '+(isMac?'⌘':'Ctrl')+'+Z to undo.','dirty')}
